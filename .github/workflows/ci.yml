name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    name: MoonBit check & test (native)
    runs-on: ubuntu-latest

    # The integration tests talk to a real FTP daemon: the `bogem/ftp` image,
    # which is vsftpd 3.0.3. `bogem/ftp` is pinned rather than a Python daemon
    # because it is the image the project supports against, and vsftpd is the
    # daemon that exercises the `disable_mlsd` / `MDTM` / `EPSV` fallbacks for
    # real. There is deliberately no mock server any more.
    #
    # Four profiles run side by side, one container each:
    #   full     2121  the reference server
    #   no-mlst  2122  MLST/MLSD refused, `disable_mlsd` must fall back to LIST
    #   no-time  2123  MDTM refused, so no modification time is readable
    #   no-epsv  2124  EPSV refused, PASV must be used and kept
    env:
      FTP_TEST_HOST: 127.0.0.1
      FTP_TEST_PORT: "2121"
      FTP_TEST_USER: test
      FTP_TEST_PASS: test
      FTP_TEST_FIXTURE: /fixture
      FTP_TEST_DIR: /upload
      FTP_TEST_PORT_NO_MLST: "2122"
      FTP_TEST_PORT_NO_TIME: "2123"
      FTP_TEST_PORT_NO_EPSV: "2124"
      # Where .ci/start-ftp.sh stages the fixture and the per-profile configs.
      FTP_ROOT: ${{ github.workspace }}/.ci/ftp-root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: moon version --all

      # A fresh runner has no ~/.moon/registry index, so `moon check` would fail
      # with "module was not found in the registry" for moonbitlang/async and
      # moonbitlang/x. Sync the registry index (and pull dependencies) first.
      - name: moon update
        run: moon update

      # FTP needs a real TCP + TLS stack, so only the native backend is built.
      # `preferred_target = native` in moon.mod makes wasm builds fail.
      - name: moon check
        run: |
          moon fmt --check
          moon check --target native --deny-warn
          moon info
          git diff --exit-code
          git status

      # Pulls `bogem/ftp`, which is public, and starts one container per
      # profile. The script polls each control port and exits non-zero when a
      # profile does not come up.
      - name: Start FTP server
        run: .ci/start-ftp.sh

      - name: moon test
        run: |
          moon test --target native --deny-warn --enable-coverage
          moon coverage report -f summary

      - name: FTP server log
        if: always()
        run: |
          for profile in full no-mlst no-time no-epsv; do
            echo "===== moonbit-ftp-$profile ====="
            docker logs "moonbit-ftp-$profile" 2>&1 | tail -40 || true
          done

      - name: moon build
        run: |
          moon build --target native
          moon build --target native --release

      - name: moon run cmd
        run: |
          moon run cmd/ftp -- --help

      - name: Tokei
        run: docker run --rm -v $(pwd):/src ghcr.io/xampprocky/tokei:latest .
