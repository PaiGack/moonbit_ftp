# Base vsftpd configuration for the integration tests.
#
# The tests run against the real `bogem/ftp` image (vsftpd 3.0.3), not against
# a Python daemon. This file reproduces the image defaults and is the common
# prefix of every server profile: `.ci/start-ftp.sh` concatenates it with one
# `vsftpd-<profile>.conf` overlay.
#
# Keep in sync with the image: `etc/vsftpd/vsftpd.conf` and
# `usr/sbin/run-vsftpd.sh` in bogem/ftp.

listen=YES
listen_ipv6=NO
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Virtual users, as the image sets them up, backed by pam_userdb.
guest_enable=YES
virtual_use_local_privs=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
pam_service_name=vsftpd_virtual

local_root=/srv

# `chroot_local_user` is what makes the absolute paths the tests use
# (`/fixture/hello.txt`, `/upload/...`) resolve inside the served tree. Without
# it vsftpd resolves them against the container root and answers 550.
# `allow_writeable_chroot` is required because /srv is writable.
chroot_local_user=YES
allow_writeable_chroot=YES
hide_ids=YES

pasv_enable=YES
# `pasv_min_port` / `pasv_max_port` / `listen_port` are appended per profile by
# `.ci/start-ftp.sh`, because every profile listens on its own range. The base
# file must not set them: vsftpd rejects a directive that appears twice, so a
# duplicated `pasv_min_port` makes the daemon refuse to start.
pasv_addr_resolve=NO
# `pasv_address` is appended by the image entrypoint from `PASV_ADDRESS`.

xferlog_enable=YES
log_ftp_protocol=YES
port_enable=YES
connect_from_port_20=YES
ftp_data_port=20

seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty

# The tests must not be surprised by vsftpd's 600s idle timeout when a debugger
# is attached; the MoonBit client always finishes long before this.
idle_session_timeout=300
