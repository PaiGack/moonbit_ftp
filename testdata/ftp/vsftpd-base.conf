# Base vsftpd configuration for the integration tests.
#
# The tests run against the real `jmoyer/vsftpd` image, which ships **vsftpd
# 3.0.5** on Debian Trixie. This file reproduces the image defaults and is the
# common prefix of every server profile: scripts/start-ftp.sh concatenates it
# with one `vsftpd-<profile>.conf` overlay and appends the per-profile
# `listen_port`.
#
# Keep in sync with the image: `etc/vsftpd/vsftpd.conf` and
# `usr/sbin/run-vsftpd.sh` in jmoyer/vsftpd (built from
# gitlab.com/jmoyer-glr/container-builds/vsftpd).

# Run in the foreground so the container stays alive and `docker logs` works.
background=NO

listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Virtual users, backed by pam_userdb against `/etc/vsftpd/virtual_users`.
#
# `guest_username=ftp` is vsftpd's built-in default and the image ships an
# `ftp` user (uid 100); it is restated because it is a hard requirement, not a
# coincidence: without the user vsftpd answers
# `500 OOPS: vsftpd: cannot locate user specified in 'guest_username':ftp`
# before it even reads a command. `virtual_use_local_privs=YES` then lets the
# virtual user write, which the upload tests need.
guest_enable=YES
guest_username=ftp
virtual_use_local_privs=YES
pam_service_name=vsftpd_virtual

# The image serves `local_root=/home/vsftpd/$USER`; scripts/start-ftp.sh bind
# mounts the fixture tree there, so the tests see `/fixture/...` (read only)
# and `/upload/...` (writable) after the chroot.
user_sub_token=$USER
local_root=/home/vsftpd/$USER

# `chroot_local_user` is what makes the absolute paths the tests use
# (`/fixture/hello.txt`, `/upload/...`) resolve inside the served tree. Without
# it vsftpd resolves them against the container root and answers 550.
# `allow_writeable_chroot` is required because the served tree is writable.
chroot_local_user=YES
allow_writeable_chroot=YES
hide_ids=YES

# `/etc/vsftpd` is where the entrypoint writes the user db and reads the
# config, so it must stay the first writable directory the daemon can chroot
# into. The image default already points here; it is restated so a future
# overlay cannot silently move it.
secure_chroot_dir=/home/vsftpd

# Passive mode: `pasv_enable`, `pasv_min_port`, `pasv_max_port`,
# `pasv_address` and `pasv_addr_resolve` are appended by the image entrypoint
# (`run-vsftpd.sh`) from the `PASV_*` environment variables set by
# scripts/start-ftp.sh. They must NOT be written here: vsftpd rejects a
# directive that appears twice and exits 2 with no message, which turns a
# duplicate `pasv_min_port` into a silent "container did not come up".

xferlog_enable=YES
port_enable=YES
connect_from_port_20=YES

# Disable the post-login seccomp filter.
#
# The filter built by `seccompsandbox.c` describes the syscalls a 2011-era
# glibc issued, and the daemon the tests run against (`jmoyer/vsftpd`, i.e.
# vsftpd 3.0.5 linked against a modern glibc) issues several that are not in
# the allow list. The *first* syscall the login child makes after
# `seccomp_sandbox_lockdown()` returns is therefore refused with
# `SECCOMP_RET_KILL`, and the child dies of SIGSYS before it can send the
# reply the test is waiting for.
#
# What makes this so hard to read is where the process dies. vsftpd has
# already written the `500 ` prefix of its banner, so the client reads
# `500 OOPS: ` and then the socket is reset -- it never sees the real error
# and the test reports an unrelated failure. `getuid`, `getgid`, `access`,
# `stat`, `fstat`, `chown`, `chmod`, `ioctl`, `poll`, `pipe` and `dup` are
# all absent from the allow list (and `open()` is present with a flag mask
# that a plain `O_TRUNC` call fails), while `str_netfd_write` consults
# `getuid()` before every reply. That is why the failure hits every profile
# at once and looks like a server bug rather than a sandbox one.
#
# The strict filter is good hardening in production; here it only turns
# "the server answered 553" into "the server vanished", so it is off. The
# tests still run against a real vsftpd: chroot, guest users, the capability
# profiles and passive mode are all untouched.
seccomp_sandbox=NO

# The tests must not be surprised by vsftpd's 600s idle timeout when a debugger
# is attached; the MoonBit client always finishes long before this.
idle_session_timeout=300
