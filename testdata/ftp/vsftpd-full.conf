# Profile: `full` — the reference server, no capability is disabled.
#
# vsftpd 3.0.3 advertises exactly this through FEAT:
#   EPRT / EPSV / MDTM / PASV / REST STREAM / SIZE / TVFS
# Note what is *absent*: MLST, MLSD, MFMT and UTF8. That is the whole reason
# the MLST / MFMT tests assert "the server does not support it and the client
# degrades to LIST" instead of assuming RFC 3659 is available.
#
# Nothing to override over the base profile.
