# Profile: `no-mlst` — MLST and MLSD are refused.
#
# vsftpd 3.0.5 never implements MLST/MLSD (`500 Unknown command.`), but this
# profile makes the refusal explicit at the configuration level so a client
# that trusts a stale capability cache is caught. It pins the `disable_mlsd`
# code path (`list` must fall back to `LIST`).
#
# Wire behaviour: `cmds_denied` answers `550 Permission denied.` instead of the
# `500 Unknown command.` a build without the commands returns. Both are server
# errors the client must degrade from, which is exactly what the test asserts.
cmds_denied=MLST,MLSD
