# Profile: `no-mlst` — the server answers 500 to MLST and MLSD.
#
# vsftpd never implements MLST/MLSD, but this profile makes the refusal
# explicit so a client that trusts a stale capability cache is caught.
# It pins the `disable_mlsd` code path (`list` must fall back to `LIST`).
cmds_denied=MLST,MLSD
