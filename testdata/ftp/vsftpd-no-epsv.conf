# Profile: `no-epsv` — EPSV is refused, so the client must fall back to PASV
# and keep using it for the rest of the session.
#
# This is the real-server counterpart of the old mock's "EPSV returns 500"
# case: `get_data_port` disables EPSV after the first failure, and every later
# transfer goes through PASV without retrying.
#
# `cmds_denied=EPSV` answers `550 Permission denied.`; PASV keeps working, as
# the test proves by running two transfers back to back.
cmds_denied=EPSV
