# Profile: `no-time` — MDTM is refused, so the client has no way to read or
# write modification times.
#
# Replaces the old Python `no-time` mock profile with a real configuration
# switch: `cmds_denied` makes vsftpd answer 550 to the command itself, which is
# what a server without time support does on the wire.
cmds_denied=MDTM,MFMT
