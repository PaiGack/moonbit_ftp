# Profile: `no-time` — MDTM is refused, so the client has no way to read or
# write modification times.
#
# Replaces the old Python `no-time` mock profile with a real configuration
# switch. `cmds_denied` makes vsftpd answer `550 Permission denied.` to the
# command itself, which is what a server without time support does on the wire.
#
# vsftpd keeps advertising `MDTM` in its FEAT list even when the command is
# denied, so `is_get_time_supported()` still reports true and the failure only
# shows up when the command is attempted. The test pins that quirk.
cmds_denied=MDTM,MFMT
