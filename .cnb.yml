# CNB 流水线按 GitHub Actions（.github/workflows/ci.yml）的 job 逐步对齐：
# 同一个 job 里按顺序跑同一批步骤，每一步都调同一个脚本，不在这里内联任何
# moon 命令或账号 / 端口。
#
# 唯一的结构差异是 FTP 服务器：GitHub Actions 与带 docker service 的
# DinD 容器共用网络命名空间，所以 scripts/start-ftp.sh 起的 vsftpd 直接监听
# 宿主 127.0.0.1:21；GitHub Actions 上同理用 --network host。两边账号 / 端口
# 都只在脚本和 cmd/*/.env.example 里出现一次，两个平台完全同源。
.ftp-ci-env: &ftp-ci-env
  docker:
    build:
      dockerfile: .ide/Dockerfile
      versionBy:
        - .ide/Dockerfile

# 与 GitHub Actions 的 job 一一对应，共用同一段步骤，避免两处流水线漂移。
.ci: &ci
  name: moonbit
  script: bash scripts/ci.sh

main:
  push:
    - <<: *ftp-ci-env
      services:
        - docker
      stages:
        - *ci
  pull_request:
    - <<: *ftp-ci-env
      services:
        - docker
      stages:
        - *ci

$:
  vscode:
    - docker:
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
