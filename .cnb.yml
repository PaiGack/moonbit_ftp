main:
  push:
    - stages:
        - name: build
          script: |
            curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
            export PATH="$HOME/.moon/bin:$PATH"
            moon version
            moon check
            moon build
            moon test

  pull_request:
    - stages:
        - name: build
          script: |
            curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
            export PATH="$HOME/.moon/bin:$PATH"
            moon version
            moon check
            moon build
            moon test
