.ftp-ci-env: &ftp-ci-env
  docker:
    build:
      dockerfile: .ide/Dockerfile
      versionBy:
        - .ide/Dockerfile

# 真实 FTP 服务器演示：起 vsftpd 容器，跑 cmd/example，然后清理容器。
# 与 moon-test 共用 docker service（DinD），端口通过 --network host 暴露。
.ftp-demo: &ftp-demo
  name: ftp-demo
  scripts:
    - shell: scripts/start-ftp.sh
    - shell: |
        export FTP_TEST_HOST=127.0.0.1 FTP_TEST_PORT=21 \
               FTP_TEST_USER=test FTP_TEST_PASS=test
        moon run cmd/example --target native
    - shell: scripts/stop-ftp.sh || true

# push 与 pull_request 共用同一段构建步骤，避免两处脚本漂移。
.moon-test: &moon-test
  name: moon test
main:
  push:
    - <<: *ftp-ci-env
      services:
        - docker
      stages:
        - *moon-test
        - *ftp-demo
  pull_request:
    - <<: *ftp-ci-env
      services:
        - docker
      stages:
        - *moon-test
        - *ftp-demo

$:
  vscode:
    - docker:
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker