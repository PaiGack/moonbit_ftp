.ftp-ci-env: &ftp-ci-env
  docker:
    build:
      dockerfile: .ide/Dockerfile
      versionBy:
        - .ide/Dockerfile

# push 与 pull_request 共用同一段构建步骤，避免两处脚本漂移。
.moon-test: &moon-test
  name: moon test
main:
  push:
    - <<: *ftp-ci-env
      services:
        - docker
      stages:
        - *moon-test
  pull_request:
    - <<: *ftp-ci-env
      services:
        - docker
      stages:
        - *moon-test

$:
  vscode:
    - docker:
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
