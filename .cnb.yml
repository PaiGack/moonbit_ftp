# 构建环境复用 .ide/Dockerfile 构建的镜像，避免每次流水线重复安装 MoonBit 工具链。
# 镜像由平台按 versionBy 计算哈希缓存：.ide/Dockerfile 未变时直接复用，不再重复 docker build。
#
# FTP 需要真实 TCP + TLS，moon.mod 里 preferred_target = "native"，
# 因此所有 moon 命令都显式带 --target native，也不再有 wasm-gc 构建步骤。
# native 后端需要 C 编译器与 libc 头文件，两者由 .ide/Dockerfile 提供。
#
# 测试分两轨（docs/porting/05-testing.md）：
#   A 轨 纯解析用例，moon test 直接跑；
#   B 轨 真实 FTP 服务器端到端，靠 FTP_TEST_* 环境变量启用。
# 这里用 DinD 起 pyftpdlib（.github/ftp-fixture/serve.py），把仓库里固定的
# fixture 挂进容器，B 轨用例因此每轮 CI 都在真服务器上跑，而不是静默跳过。
# 同一份服务器也由 `$: vscode:` 在云原生开发环境里起好，账号端口完全一致。

# 真实 FTP 服务器的账号与路径。fixture 内容由 git 固定，容器挂载只读。
.ftp-test-env: &ftp-test-env
  FTP_TEST_HOST: 127.0.0.1
  FTP_TEST_PORT: "2121"
  FTP_TEST_USER: test
  FTP_TEST_PASS: test
  FTP_TEST_FIXTURE: /fixture
  FTP_TEST_DIR: /upload

# 启动 FTP 容器的公共脚本体。
#   .ci/ftp-root 从仓库拷出（已 gitignore），upload/ 是可写的空目录；
#   fixture 只读挂在容器内 /srv/fixture；
#   被动端口固定 30000-30009，与 serve.py 默认值一致。
# 容器起不来时直接 exit 1：宁可红，也不让 B 轨用例静默跳过。
.start-ftp-server: &start-ftp-server
  name: start ftp server
  script: |
    set -euo pipefail
    mkdir -p .ci/ftp-root/upload
    cp -r .github/ftp-fixture/fixture .ci/ftp-root/
    docker rm -f moonbit-ftp >/dev/null 2>&1 || true
    docker run -d --name moonbit-ftp \
      -p 2121:2121 -p 30000-30009:30000-30009 \
      -v "$PWD/.ci/ftp-root:/srv" \
      -v "$PWD/.github/ftp-fixture/serve.py:/srv/serve.py:ro" \
      python:3.12-slim \
      sh -c 'pip install --quiet "pyftpdlib==2.2.0" && exec python /srv/serve.py --root /srv/ftp-root --host 0.0.0.0 --port 2121 --pasv-address 127.0.0.1'
    for i in $(seq 1 60); do
      if python3 -c "import socket; socket.create_connection(('127.0.0.1', 2121), 1).close()"; then
        echo "FTP server is up on 127.0.0.1:2121 (user test / pass test)"
        echo "B 轨用例已启用：moon test --target native --deny-warn"
        exit 0
      fi
      sleep 2
    done
    echo "FTP server did not come up" >&2
    docker logs moonbit-ftp >&2
    exit 1

.stop-ftp-server: &stop-ftp-server
  name: ftp server log and stop
  script: |
    docker logs moonbit-ftp || true
    docker rm -f moonbit-ftp || true

.moon-test: &moon-test
  name: moon test
  script: |
    export PATH="$HOME/.moon/bin:$PATH"
    moon version
    moon check --target native --deny-warn
    moon build --target native
    moon test  --target native --deny-warn

.ftp-ci-env: &ftp-ci-env
  docker:
    build:
      dockerfile: .ide/Dockerfile
      by:
        - .ide/Dockerfile
      versionBy:
        - .ide/Dockerfile

main:
  push:
    - <<: *ftp-ci-env
      services:
        - docker
      env:
        <<: *ftp-test-env
      stages:
        - *start-ftp-server
        - *moon-test
      endStages:
        - *stop-ftp-server

  pull_request:
    - <<: *ftp-ci-env
      services:
        - docker
      env:
        <<: *ftp-test-env
      stages:
        - *start-ftp-server
        - *moon-test
      endStages:
        - *stop-ftp-server

# 云原生开发环境：进入工作区前把同一个 FTP 服务器起好，
# 这样在 IDE 里直接 `moon test --target native` 跑的就是真服务器用例。
# 账号 / 端口 / fixture 与 CI 完全一致（同一个 serve.py），不再需要手工准备环境。
$:
  vscode:
    - docker:
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      env:
        <<: *ftp-test-env
      stages:
        - *start-ftp-server
      endStages:
        # 开发环境销毁时一并清掉容器；日常使用期间 FTP 常驻，无需重启。
        - *stop-ftp-server
